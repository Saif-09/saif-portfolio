# Compile every resume variant from resume/resume.tex and commit the PDFs back.
#
# Why: each variant is served straight from public/, so the live URLs are
# whatever this workflow last committed. Edit the .tex from anywhere (including
# github.dev on a phone), push, and the deployed PDFs follow within a minute.
# No local LaTeX install required.
#
# build.sh fails the run if any variant is not exactly one page, and nothing is
# committed when it fails, so a bad edit cannot publish a 2-page resume.
name: Build resume PDFs

on:
  push:
    branches: [main]
    # Only the source triggers a build. The PDFs this workflow commits are not
    # in this list, so it can never retrigger itself.
    paths:
      - 'resume/resume.tex'
      - 'resume/build.sh'
      - '.github/workflows/resume.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same image xu-cheng/latex-action uses, called directly so one image
      # pull (~2 min, the bulk of this job) covers all four compiles instead of
      # one pull per variant. Carries fontawesome5, extarticle, glyphtounicode.
      - name: Build all variants
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            ghcr.io/xu-cheng/texlive-full:latest \
            bash resume/build.sh

      # The container writes as root; hand the files back to the runner.
      - name: Fix ownership
        run: sudo chown -R "$(id -u):$(id -g)" resume/out resume/.build

      - name: Stage PDFs for the site
        run: cp resume/out/*.pdf public/

      # A downloadable copy on the run itself, even when the commit is a no-op.
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: resume/out/*.pdf

      - name: Commit the rebuilt PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Mohd_Saif_Resume*.pdf
          # No diff means the .tex change was cosmetic; nothing to push.
          if git diff --quiet --cached; then
            echo "PDFs are byte-identical, nothing to commit"
          else
            # Deliberately no [skip ci] here: Vercel treats it as "skip this
            # deployment", so the rebuilt PDFs would never reach the live URLs.
            # The paths: filter above is what stops this commit from
            # retriggering the workflow.
            git commit -m "Rebuild resume PDFs from resume.tex"
            git push
          fi
