<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resume · Mohd Saif</title>
    <!--
      Trailing-slash fallback. /resume is a real 302 at the routing layer
      (astro.config.mjs redirects); this file only catches /resume/ , which
      that route's regex does not match. Autocomplete and some link parsers
      add the slash, and the whole point of the URL is that it always works.
    -->
    <meta http-equiv="refresh" content="0; url=/Mohd_Saif_Resume.pdf" />
    <link rel="canonical" href="https://saifsiddiqui.in/Mohd_Saif_Resume.pdf" />
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <p>Redirecting to <a href="/Mohd_Saif_Resume.pdf">Mohd Saif's resume</a>.</p>
  </body>
</html>
